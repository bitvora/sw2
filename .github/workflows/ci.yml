name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: build
        run: go build -o sw2 .

      - name: build legacy export tool
        run: cd tools/export-legacy-db && go build -o export-legacy-db .

      - name: unit + integration tests
        run: go test ./...

      - name: e2e - permission matrix
        run: go run ./e2e -binary ./sw2 -matrix

      - name: e2e - open lists
        run: go run ./e2e -binary ./sw2 -open

      - name: e2e - legacy whitelist primacy
        run: go run ./e2e -binary ./sw2 -legacy

      - name: e2e - env-var whitelists
        run: go run ./e2e -binary ./sw2 -env
